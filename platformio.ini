[platformio]
default_envs = esp32s3_ili9341

; ====================================================================
; MÔI TRƯỜNG 1: DÀNH CHO MÀN HÌNH ĐỎ 2.4" TFT SPI 240X320 V1.3 (ILI9341)
; ====================================================================
[env:esp32s3_ili9341]
platform = espressif32 @ 6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = 
    ; --- TFT ILI9341 SPI 240x320 (shared with nRF24 radios) ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=21
    -D TFT_RST=14
    -D TFT_BL=-1
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=6000000
    -D SUPPORT_TRANSACTIONS=1
lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.43
    nrf24/RF24 @ ^1.4.10
    bblanchon/ArduinoJson@^7.0.4
    mikalhart/TinyGPSPlus @ ^1.1.0

; ====================================================================
; MÔI TRƯỜNG 2: DÀNH CHO MÀN HÌNH ST7789 240X320 GỐC
; ====================================================================
[env:esp32s3_st7789]
platform = espressif32 @ 6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = 
    ; --- TFT ST7789 SPI 240x320 (shared with nRF24 radios) ---
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=21
    -D TFT_RST=14
    -D TFT_BL=-1
    -D TFT_INVERSION_OFF=1
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000
    -D SUPPORT_TRANSACTIONS=1
lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.43
    nrf24/RF24 @ ^1.4.10
    bblanchon/ArduinoJson@^7.0.4
    mikalhart/TinyGPSPlus @ ^1.1.0
